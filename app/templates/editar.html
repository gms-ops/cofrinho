{% extends "base.html" %}
{% block titulo %}Editar {{ meta.nome }} | Cofrinho{% endblock %}
{% block conteudo %}
<section class="nova editar" aria-labelledby="titulo-editar">
  <h2 id="titulo-editar">Editar meta</h2>
  <form method="post" action="{{ url_for('metas.editar', meta_id=meta.id) }}" novalidate>
    <label for="nome">Nome da meta</label>
    <input id="nome" name="nome" type="text" value="{{ meta.nome }}" autocomplete="off">
    <label for="alvo">Valor-alvo (R$)</label>
    <input id="alvo" name="alvo" type="text" inputmode="decimal" value="{{ meta.alvo }}" autocomplete="off">
    <label for="prazo">Prazo</label>
    <input id="prazo" name="prazo" type="date" value="{{ meta.prazo.isoformat() }}">
    <button type="submit">Salvar alterações</button>
    <a class="link" href="{{ url_for('metas.index') }}">Cancelar</a>
  </form>
</section>
{% endblock %}
