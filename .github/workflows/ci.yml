name: CI

on: [push, pull_request]

jobs:
  testes:
    name: Testes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Testes de unidade e integração com cobertura
        run: pytest --cov=app --cov-branch --cov-report=term-missing --cov-report=xml --cov-fail-under=80

      - name: Enviar cobertura ao Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          flags: ${{ matrix.os }}
          fail_ci_if_error: false

      - name: Instalar navegador do Playwright
        run: python -m playwright install --with-deps chromium

      - name: Testes ponta a ponta (e2e)
        run: pytest tests/e2e
